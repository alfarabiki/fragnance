# Supabase configuration for the ATLASE project.
# Apply to the hosted database:
#   export SUPABASE_ACCESS_TOKEN=<your-token>
#   supabase link --project-ref ecztdymcmzcaffdwhjur
#   supabase db push
# (or, if you can reach Postgres directly, run from the repo root:
#   psql "<connection-string>" -f database/migrations/0001_initial_schema.sql
#   psql "<connection-string>" -f database/migrations/0002_rls_policies.sql
#   psql "<connection-string>" -f database/seeds/0001_seed.sql )

project_id = "ecztdymcmzcaffdwhjur"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322

[studio]
enabled = true
port = 54323

[auth]
enabled = true

[analytics]
enabled = false